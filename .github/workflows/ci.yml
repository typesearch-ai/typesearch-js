name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Node ${{ matrix.node }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        node: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run test:coverage
      - run: npm run build
      - run: npm run smoke
      - if: matrix.node == 24
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist

  # The package supports runtimes the test runner does not: check the built package on each of them.
  runtimes:
    name: ${{ matrix.runtime }}
    needs: test
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        runtime: [node18, bun, deno]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - if: matrix.runtime == 'node18'
        uses: actions/setup-node@v7
        with:
          node-version: 18
      - if: matrix.runtime == 'node18'
        run: npm run smoke
      - if: matrix.runtime == 'bun'
        uses: oven-sh/setup-bun@v2
      - if: matrix.runtime == 'bun'
        run: bun test/smoke/esm.mjs
      - if: matrix.runtime == 'deno'
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
      - if: matrix.runtime == 'deno'
        run: deno run --allow-net --allow-read --allow-env test/smoke/esm.mjs

  package:
    name: Package contents
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run build
      - run: npm pack --dry-run
      # ESM and CommonJS types resolve right in every TypeScript mode (node10, node16, bundler).
      - run: npx -y @arethetypeswrong/cli@0 --pack .
